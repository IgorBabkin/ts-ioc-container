# yaml-language-server: $schema=../../../tic.schema.json
# Production: the services and the infrastructure adapters, minus dev-only *.dev.ts files.
output: src/di/prod.bundle.ts
glob:
  paths:
    - '@app/services'
    - ./src/infra
  exclude:
    - '**/*.dev.ts'
    - '**/*.spec.ts'
    - '**/*.test.ts'
    - '**/*.spec.tsx'
    - '**/*.test.tsx'
    - '**/__tests__/**'
    - '**/node_modules/**'
