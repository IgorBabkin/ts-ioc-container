name: pr-checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # Squash merging is disabled, so every commit of a PR reaches main, and
  # release-monorepo-semantically decides each package's bump from those
  # commits' subjects (`git log --format=%s`). Lint all of them: a release
  # type needs an exact package scope, or it releases nothing.
  commit-messages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm-store

      - name: Install dependencies
        run: pnpm run ci

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test-pr:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm run ci

      # Every root script below runs recursively across the workspace, so the
      # build has to come first: @ts-ioc-container/react resolves
      # ts-ioc-container through the workspace link and reads its build output.
      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm test --maxWorkers=2

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
