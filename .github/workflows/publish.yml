name: publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same build, static checks and tests a pull request runs (the build
  # action), plus coverage. It hands the build output to the release job as an
  # artifact so the release publishes exactly what was tested.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        uses: ./.github/actions/build
        with:
          coverage: true

  release:
    needs: build
    environment:
      name: production
      url: https://www.npmjs.com/package/ts-ioc-container
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # Required for OIDC
      contents: write  # Required for creating releases and tags
      issues: write    # Required for creating issue comments
      pull-requests: write  # Required for creating PR comments
      packages: write  # Required for publishing to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required so `report` can walk commit history back to each package's last release tag
          token: ${{ github.token }}  # Use the workflow token for authenticated fetch/push

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with OIDC
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        # OIDC authentication is automatically used when:
        # 1. permissions.id-token: write is set (see the job's permissions)
        # 2. npm 11.5.1+ is installed (next step)
        # 3. Trusted Publishing is configured in npm account settings

      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm-store

      - name: Ensure npm 11.5.1 or later for OIDC
        # Pin to the npm 11 line: it satisfies the OIDC requirement (>= 11.5.1)
        # while staying compatible with the Node version in .nvmrc. `npm@latest`
        # now resolves to npm 12, which requires Node >= 24.15.0 and breaks here.
        run: |
          npm install -g npm@11
          npm --version

      # Still needed: the release tooling and `pnpm publish` come from the
      # workspace's dependencies.
      - name: Install dependencies
        run: pnpm run ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: packages

      # Guards the artifact hand-off: a tarball missing its build output must
      # fail here, not reach npm.
      - name: Verify package contents
        run: pnpm run verify:package-contents

      - name: Configure Git
        uses: ./.github/actions/configure-git

      - name: Generate release context
        run: |
          RELEASE_CONTEXT=$(pnpm exec monorepo-semantic-release report)
          echo "RELEASE_CONTEXT=$RELEASE_CONTEXT" >> "$GITHUB_ENV"

      - name: Update internal dependency versions
        run: pnpm exec monorepo-semantic-release package-json --context "$RELEASE_CONTEXT"

      - name: Bump versions
        run: pnpm exec monorepo-semantic-release package-manager --context "$RELEASE_CONTEXT"

      - name: Generate changelogs
        run: pnpm exec monorepo-semantic-release changelog --context "$RELEASE_CONTEXT"

      - name: Commit, tag and push
        run: pnpm exec monorepo-semantic-release vcs --context "$RELEASE_CONTEXT"

      - name: Publish to npm
        run: pnpm exec monorepo-semantic-release package-manager publish --context "$RELEASE_CONTEXT"

      - name: Create GitHub releases
        run: pnpm exec monorepo-semantic-release release-notes --context "$RELEASE_CONTEXT"
        env:
          # The step reads GITHUB_TOKEN, not GH_TOKEN — it sets GH_TOKEN itself
          # when it shells out to `gh`. GITHUB_REPOSITORY is provided by Actions.
          GITHUB_TOKEN: ${{ github.token }}
