name: Archive
description: Packs paths into a tarball, or unpacks one back over the workspace

inputs:
  mode:
    description: '`archive` to pack `paths` into `file`, `unarchive` to extract `file` and delete it'
    required: true
  file:
    description: Tarball to write or read
    required: true
  paths:
    description: Newline-separated paths to pack, relative to the workspace (mode `archive` only)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Everything, mode validation included, lives in the Makefile next to this
    # file so it can be run and debugged locally — see this action's README.
    - name: Archive
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FILE: ${{ inputs.file }}
        PATHS: ${{ inputs.paths }}
      run: make --no-print-directory -f "${{ github.action_path }}/Makefile" run
