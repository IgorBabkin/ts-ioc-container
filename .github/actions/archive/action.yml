name: Archive
description: Packs paths into a tarball, or unpacks one back over the workspace

inputs:
  mode:
    description: '`archive` to pack `paths` into `file`, `unarchive` to extract `file` and delete it'
    required: true
  file:
    description: Tarball to write or read
    required: true
  paths:
    description: Newline-separated paths to pack, relative to the workspace (mode `archive` only)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # `mode` selects one of the repository root Makefile's targets, which hold
    # the actual work. Validating it here keeps the error legible: an unchecked
    # typo would surface as make's own "no rule to make target" instead.
    #
    # The inputs reach the shell as environment variables and are handed to
    # make as explicit arguments: every make target is a function of what it
    # is passed, and interpolating inputs into the script text would make this
    # step injectable.
    - name: Archive
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FILE: ${{ inputs.file }}
        PATHS: ${{ inputs.paths }}
      run: |
        case "$MODE" in
          archive | unarchive) ;;
          *)
            echo "::error::archive: unknown mode '$MODE' (expected 'archive' or 'unarchive')" >&2
            exit 1
            ;;
        esac
        make -C "$GITHUB_WORKSPACE" --no-print-directory "$MODE" \
          FILE="$FILE" PATHS="$PATHS"
