name: Upload build artifacts
description: Uploads the built cjm/esm/typings output for every released package as a single artifact

runs:
  using: composite
  steps:
    # The build output is archived into one tarball before upload, and the
    # tarball (not the directories) is what actions/upload-artifact sees.
    #
    # upload-artifact roots an artifact at the least common ancestor of the
    # paths it is given, and download-artifact unpacks that artifact relative
    # to the workspace. Handing it the six package directories directly made
    # that root `packages/`, so the download restored them to `ts-ioc-container/cjm`
    # and `react/cjm` at the repo root instead of `packages/<pkg>/cjm` — leaving
    # every `files` glob in the packages unmatched and publishing tarballs that
    # held nothing but package.json, README.md and LICENSE. A single-file path
    # has no ancestor to compute, so the paths inside the tarball are the only
    # thing that decides where the output lands.
    - name: Archive build output
      shell: bash
      run: |
        set -euo pipefail
        tar -czf build-output.tar.gz \
          packages/ts-ioc-container/cjm \
          packages/ts-ioc-container/esm \
          packages/ts-ioc-container/typings \
          packages/react/cjm \
          packages/react/esm \
          packages/react/typings

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        retention-days: 1
        path: build-output.tar.gz
